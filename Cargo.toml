[package]
name        = "AudioSpeedHack"
version     = "1.3.0"
edition     = "2024"
description = "Galgame audio real-time processing tool based on DLL injection, including SPEEDUP and ZeroInterrupt."
readme      = "README.md"
repository  = "https://github.com/lxl66566/AudioSpeedHack"
license     = "MIT"
keywords    = ["audio", "dsound", "speed", "speedup"]
categories  = ["command-line-utilities", "games", "multimedia::audio"]

[dependencies]
anyhow               = "1"
clap                 = { version = "4.6", features = ["derive"] }
config-file2         = "0.7"
goblin               = "0.10"
include_assets       = { version = "1.0.0", default-features = false, features = ["zstd"] }
log                  = "0.4"
once-fn              = "0.2.1"
pretty_env_logger    = "0.5.0"
serde                = "1"
strum                = "0.28"
strum_macros         = "0.28"
terminal-menu        = "3.1.0"
windows-env          = "0.3.0"
windows_registry_obj = "0.1.0"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
lto       = true
panic     = "abort"
